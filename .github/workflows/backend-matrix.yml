#
# backend-matrix.yml — Echidna catalogue validation + real wiremock transport.
#
# Previously this expanded every entry in echidna's provers.a2ml to a separate
# Rust job (142 jobs on the 2026-10-29 PR run; max-parallel=3). Each job ran
# precisely the same wiremock transport suite. ECHIDNA_PROVER was set, but
# neither the client nor its tests read it. The matrix therefore produced
# identical evidence many times, at high latency and runner cost.
#
# Keep the authoritative Echidna prover inventory check. Run the one transport
# suite once. Do NOT label a mock transport check as per-prover verification.
# If the client starts consuming ECHIDNA_PROVER, the guard below fails and the
# real per-prover matrix must be restored, with distinct per-prover assertions
# (ideally against the live Echidna implementations). Do not bypass the guard.

name: Backend Matrix

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch: {}

# Each PR revision supersedes only earlier revisions of the same PR. Pushes
# to main retain their independent verification history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prep:
    name: Validate Echidna prover catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout vcl-ut
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Echidna authoritative prover source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/echidna
          path: echidna
          fetch-depth: 1
          persist-credentials: false

      - name: Validate prover slugs from provers.a2ml
        run: |
          set -euo pipefail
          a2ml=echidna/.machine_readable/provers.a2ml
          test -s "$a2ml"
          slugs="$(grep -E '^slug = ' "$a2ml" | sed -E 's/^slug = "(.+)"$/\1/')"
          count="$(printf '%s\n' "$slugs" | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "::error::Echidna prover catalogue contains no slugs"
            exit 1
          fi
          if printf '%s\n' "$slugs" | grep -Ev '^[a-z][a-z0-9_]*$'; then
            echo "::error::Echidna catalogue contains an invalid slug"
            exit 1
          fi
          declared="$(sed -nE 's/^count[[:space:]]*=[[:space:]]*([0-9]+)$/\1/p' "$a2ml" | head -1)"
          if [ "$declared" != "$count" ]; then
            echo "::error::Echidna catalogue count mismatch: declared=$declared parsed=$count"
            exit 1
          fi
          unique="$(printf '%s\n' "$slugs" | sort -u | wc -l | tr -d ' ')"
          if [ "$count" -ne "$unique" ]; then
            echo "::error::Echidna prover catalogue contains duplicate slugs"
            exit 1
          fi
          echo "Echidna inventory: $count distinct prover slugs; verified, not individually tested."

  smoke:
    name: Client wiremock transport (prover-independent)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout vcl-ut
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert transport tests remain independent of prover selection
        run: |
          set -euo pipefail
          # If future source/tests begin reading the selector, a single suite
          # cannot certify them. Fail rather than silently lose coverage.
          test -d src/interface/echidna-client/src
          test -d src/interface/echidna-client/tests
          if grep -RFn 'ECHIDNA_PROVER' \
               src/interface/echidna-client/src \
               src/interface/echidna-client/tests; then
            echo "::error::ECHIDNA_PROVER is now consumed: restore a genuine per-prover test matrix"
            exit 1
          fi
          echo "Prover selector unused; one wiremock transport suite is sufficient."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: backend-matrix

      # This client is not a root workspace member and depends on Echidna
      # source as a sibling path-dependency.
      - name: Provide Echidna sibling for echidna-core path dependency
        run: git clone --depth 1 https://github.com/hyperpolymath/echidna ../echidna

      - name: Client wiremock transport suite
        run: cargo test --manifest-path src/interface/echidna-client/Cargo.toml --tests
