# SPDX-License-Identifier: MPL-2.0
# Fail-closed REUSE compliance gate.
# Blocks merge if any file is missing SPDX copyright/licence information.
---
name: REUSE compliance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reuse
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint
