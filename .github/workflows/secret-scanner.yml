# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Canonical standards owner after transfer; exact reviewed commit pin.
    # The reusable runs pinned local scanners with contents: read only and
    # explicitly declares no workflow_call secrets. Do not inherit secrets.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    permissions:
      contents: read
