# SPDX-License-Identifier: MPL-2.0

# Standalone workspace root (same rationale as
# src/interface/parse/Cargo.toml): this FFI boundary crate builds and gates
# in isolation from the other workspace roots. Its ONLY dependency is the
# in-repo, forbid-unsafe `vcltotal-parse` (`src/interface/parse`, an
# internal path-dep that resolves in a standalone checkout, unlike the
# external `../../../echidna/...` dependency of `src/interface`).
[workspace]

[package]
name = "vcltotal-recompute-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/vcl-ut"
description = "P5c (#25): the recompute-PCC tier's wasm32 entry. Wraps the forbid-unsafe `vcltotal-parse` decoder+decider; the ONLY unsafe is one audited host/guest memory-ABI block (the declared trust boundary)."

[lib]
name = "vcltotal_recompute_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
vcltotal-parse = { path = "../../../src/interface/parse" }

# Total/panic-free is inherited from `vcltotal-parse`'s static SPARK
# lint set (the decoder/decider carry no panics). `panic = "abort"`
# removes the unwinding runtime from the cdylib so a (by-construction
# unreachable) panic is a trap, never UB.
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
strip = true

[profile.dev]
panic = "abort"
