# SPDX-License-Identifier: MPL-2.0
[package]
name = "vcl-total"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/vql-ut"
description = "VCL-total: 10-level type-safe query language for VeriSimDB"

# The top-level crate re-exports the formatter and linter for integration testing.
# LSP and DAP are separate binaries with heavier dependencies.

[dependencies]
vcltotal-fmt = { path = "src/interface/fmt" }
vcltotal-lint = { path = "src/interface/lint" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "vcl_bench"
harness = false

[workspace]
members = [
    ".",
    "src/core",
    "src/interface",
    "src/interface/echidna-client",
    "src/interface/fmt",
    "src/interface/lint",
    "src/interface/lsp",
    "src/interface/dap",
]
# NOTE: `src/interface/parse` (vcltotal-parse, #25 P5a) is deliberately
# NOT a member here. The pre-existing `src/interface` member carries an
# external path-dependency (`echidna-core = { path =
# "../../../echidna/..." }`) that only resolves on the estate's
# sibling-repo layout, so the whole virtual workspace fails to load in a
# standalone checkout (e.g. CI). The trusted boundary parser must build
# and gate in isolation, so it is its own workspace root (see
# src/interface/parse/Cargo.toml `[workspace]`). Tracked separately:
# the parent-workspace external-path-dep breakage is NOT a #25 concern.
