[tools]
# Language runtimes
rust = "latest"
# Pinned: `build.zig` is verified under 0.16.0 and is CI-gated at
# that version (.github/workflows/zig-shim-gate.yml). "latest" would
# let a Zig release break the FFI build without any diff.
zig = "0.16.0"
bun = "1.4"
denojs = "latest"

# Package managers
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

[tasks.setup]
description = "Install pinned JS dev tools (Prettier) from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.build]
run = "cargo build --release --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.lint]
depends = ["setup"]
run = "bunx --no-install --bun prettier --check ."

[tasks.fmt]
depends = ["setup"]
run = "bunx --no-install --bun prettier --write ."
