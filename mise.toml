[tools]
# Language runtimes
rust = "latest"
# Pinned: `build.zig` is verified under 0.16.0 and is CI-gated at
# that version (.github/workflows/zig-shim-gate.yml). "latest" would
# let a Zig release break the FFI build without any diff.
zig = "0.16.0"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"
build = "cargo build --release"
test = "cargo test"
lint = "bunx --no-install --bun prettier --check ."
fmt = "bunx --no-install --bun prettier --write ."
