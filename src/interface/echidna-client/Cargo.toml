# SPDX-License-Identifier: MPL-2.0

# Standalone workspace root: this crate is deliberately NOT a member of the
# parent virtual workspace (root `Cargo.toml`), because it depends on
# `vcltotal-interface`, which carries an external path-dep
# (`../../../echidna/crates/echidna-core`) that does not resolve on a
# standalone checkout. Declaring an own `[workspace]` lets the estate e2e
# CI job (`.github/workflows/backend-matrix.yml`) build/test it by
# `--manifest-path` once the echidna sibling is present, without dragging
# the unresolved path-dep into the default standalone build. Mirrors the
# same pattern used by `src/interface/parse/Cargo.toml`.
[workspace]

[package]
name = "vcltotal-echidna-client"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/vql-ut"
description = "Async REST client for echidna proof engine (localhost:8000 by default)"

[lib]
path = "src/lib.rs"

[dependencies]
# HTTP client — version pinned to match echidna's own reqwest so we never
# fight two TLS stacks in one process.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serde matches echidna-core's choice.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error type.
thiserror = "2"

# Async runtime + wiremock — only needed by the tests; `EchidnaClient`
# itself is runtime-agnostic and works under any executor that drives
# reqwest. wiremock stubs the echidna REST surface so round-trip tests
# do not need a live server.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

# Shared proof-surface types (Term, Goal, ProofState, Tactic) via vcl-ut's
# interface re-export layer. The `wire` module below redeclares REST-specific
# envelope types (ProofRequest, ProofResponse, TacticRequest, TacticResponse)
# because echidna's REST crate keeps those private to its bin target.
[dependencies.vcltotal-interface]
path = "../../interface"
